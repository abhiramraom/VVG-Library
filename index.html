<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Library Management System</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1, h2 { color: #333; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    input, select, button { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
    button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #218838; }
    
    button:disabled { background-color: #a5d6a7 !important; color: #ffffff !important; cursor: not-allowed !important; pointer-events: none !important; opacity: 0.6; }

    .btn-admin { background-color: #007bff; width: auto; padding: 8px 16px; }
    .btn-logout { background-color: #6c757d; width: auto; padding: 8px 16px; }
    
    .commentary-box { grid-column: 1 / -1; background: #eef2f7; padding: 12px; border-radius: 6px; border: 1px solid #d0d7de; }
    .commentary-row { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; }
    .commentary-row input { flex: 1; }
    .btn-remove { background: #dc3545; width: auto; padding: 6px 12px; }
    .btn-add { background: #17a2b8; margin-top: 5px; width: auto; padding: 6px 12px; }
    
    .btn-edit { background-color: #ffc107; color: #000; padding: 4px 8px; margin-right: 5px; width: auto; }
    .btn-delete { background-color: #dc3545; color: #fff; padding: 4px 8px; width: auto; }
    #searchBox { padding: 10px; font-size: 16px; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; vertical-align: middle; }
    th { background-color: #007bff; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    
    input:disabled { background-color: #e9ecef; cursor: not-allowed; }

    .autocomplete-wrapper { position: relative; width: 100%; }
    .suggestions-box {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1px solid #007bff;
      border-radius: 0 0 6px 6px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .suggestion-item {
      padding: 10px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }
    .suggestion-item:hover,
    .suggestion-item.active { 
      background-color: #007bff;
      color: #ffffff;
    }
    .suggestion-item:hover strong,
    .suggestion-item.active strong { color: #ffffff; }
    .suggestion-item:hover .suggestion-meta,
    .suggestion-item.active .suggestion-meta { color: #e0e0e0; }
    .suggestion-item strong { color: #007bff; }
    .suggestion-meta { font-size: 11px; color: #666; margin-top: 2px; }
    
    .loading-spinner { font-weight: bold; color: #007bff; padding: 15px; text-align: center; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>📚 Library Management System</h1>
    <div>
      <span id="roleBadge" style="margin-right: 10px; font-weight: bold; color: #555;">Role: Standard User</span>
      <button id="adminLoginBtn" class="btn-admin" onclick="toggleAdminLogin()">🔐 Admin Login</button>
      <button id="adminLogoutBtn" class="btn-logout" onclick="logoutAdmin()" style="display:none;">🔒 Logout Admin</button>
    </div>
  </div>

  <div class="card" id="bookFormCard">
    <h2 id="formTitle">Add New Book Entry</h2>
    <form id="addBookForm" autocomplete="off">
      <input type="hidden" id="editRowIndex" value="">
      <div class="form-grid">
        <input type="text" id="slNo" placeholder="Sl. No (Auto-generated)" disabled>
        
        <div class="autocomplete-wrapper">
          <input type="text" id="title" data-col="1" data-autocomplete="true" placeholder="Title (Original) - Type to search..." required>
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="titleEng" data-col="2" data-autocomplete="true" placeholder="Title (English)">
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="subTitle" data-col="3" data-autocomplete="true" placeholder="Sub-title">
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="author" data-col="4" data-autocomplete="true" placeholder="Author & CoAuthor">
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="editor" data-col="5" data-autocomplete="true" placeholder="Editor & Co-Editor">
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="lang" data-col="7" data-autocomplete="true" placeholder="Language">
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="vol" data-col="8" data-autocomplete="true" placeholder="Vol (IF)">
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="publisher" data-col="9" data-autocomplete="true" placeholder="Publisher">
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="year" data-col="10" data-autocomplete="true" placeholder="Year of Print">
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="isbn" data-col="11" data-autocomplete="true" placeholder="ISBN or ISSN">
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="topic" data-col="12" data-autocomplete="true" placeholder="Topic">
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="subject" data-col="13" data-autocomplete="true" placeholder="Subject">
          <div class="suggestions-box"></div>
        </div>

        <select id="condition" required>
          <option value="" disabled selected>Select Condition...</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
        </select>

        <div class="commentary-box">
          <label><strong>Commentaries & Their Authors:</strong></label>
          <div id="commentaryContainer" style="margin-top: 8px;"></div>
          <button type="button" class="btn-add" onclick="addCommentaryRow()">+ Add Commentary & Author</button>
        </div>
      </div>
      <br>
      <button type="submit" id="submitBtn">Add Book to Library</button>
      <button type="button" id="cancelBtn" onclick="resetForm()" style="background-color: #6c757d; display: none; margin-top: 5px;">Cancel Editing</button>
    </form>
  </div>

  <div class="card">
    <h2>Book Catalogue</h2>
    <input type="text" id="searchBox" onkeyup="searchBooks()" placeholder="🔍 Search by Title, Author, Subject, etc...">
    <div style="overflow-x:auto;">
      <div id="loadingIndicator" class="loading-spinner">⏳ Fetching library records, please wait...</div>
      <table id="booksTable" style="display:none;">
        <thead>
          <tr id="tableHead"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbydUNQacZxE91f6IC6vuQlZsVGGUj8-mFdwuzU2Hpw1CRjFq7DNWZT2hWyIelmYErxU/exec';
  
  let adminToken = null;
  let globalData = [];
  let selectedIndex = -1;
  let isSubmitting = false;

  window.onload = function() {
    addCommentaryRow();
    fetchBooks();
    setupGlobalAutocomplete();
  };

  function toggleAdminLogin() {
    const pwd = prompt("Enter Admin Password:");
    if (!pwd) return;

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'login', password: pwd })
    })
    .then(res => res.json())
    .then(res => {
      if (res.success) {
        adminToken = res.token;
        alert("Admin mode activated!");
        updateAdminUI(true);
      } else {
        alert("Incorrect Password!");
      }
    })
    .catch(err => alert("Connection error: " + err));
  }

  function logoutAdmin() {
    adminToken = null;
    alert("Logged out of Admin mode.");
    updateAdminUI(false);
    resetForm();
  }

  function updateAdminUI(isAdmin) {
    document.getElementById('roleBadge').innerText = isAdmin ? 'Role: Administrator' : 'Role: Standard User';
    document.getElementById('adminLoginBtn').style.display = isAdmin ? 'none' : 'inline-block';
    document.getElementById('adminLogoutBtn').style.display = isAdmin ? 'inline-block' : 'none';
    fetchBooks();
  }

  function addCommentaryRow(name, author) {
    name = name || '';
    author = author || '';
    const container = document.getElementById('commentaryContainer');
    const div = document.createElement('div');
    div.className = 'commentary-row';
    div.innerHTML = '<input type="text" class="comm-name" placeholder="Commentary Title" value="' + name + '">' +
                    '<input type="text" class="comm-author" placeholder="Author of Commentary" value="' + author + '">' +
                    '<button type="button" class="btn-remove" onclick="this.parentElement.remove()">✕</button>';
    container.appendChild(div);
  }

  function getLinkedCommentaries() {
    const names = document.querySelectorAll('.comm-name');
    const authors = document.querySelectorAll('.comm-author');
    let result = [];
    names.forEach((elem, idx) => {
      const commName = elem.value.trim();
      const commAuthor = authors[idx].value.trim();
      if (commName || commAuthor) {
        result.push((commName || 'Untitled') + ' (Author: ' + (commAuthor || 'Unknown') + ')');
      }
    });
    return result.join(' | ');
  }

  function fetchBooks() {
    const loading = document.getElementById('loadingIndicator');
    const table = document.getElementById('booksTable');
    
    loading.style.display = 'block';
    table.style.display = 'none';

    fetch(SCRIPT_URL)
      .then(res => res.json())
      .then(data => {
        globalData = data;

        const head = document.getElementById('tableHead');
        const body = document.getElementById('tableBody');

        if (data && data.length > 0) {
          let headHtml = '';
          data[0].forEach(col => { headHtml += '<th>' + col + '</th>'; });
          if (adminToken) { headHtml += '<th>Actions</th>'; }
          head.innerHTML = headHtml;

          let bodyHtml = '';
          for (let i = 1; i < data.length; i++) {
            bodyHtml += '<tr>';
            data[i].forEach(cell => {
              bodyHtml += '<td>' + (cell !== undefined ? cell : '') + '</td>';
            });

            if (adminToken) {
              bodyHtml += '<td>' +
                '<button class="btn-edit" onclick="editBook(' + i + ')">Edit</button>' +
                '<button class="btn-delete" onclick="deleteBook(' + (i + 1) + ')">Delete</button>' +
              '</td>';
            }
            bodyHtml += '</tr>';
          }
          body.innerHTML = bodyHtml;
        }

        loading.style.display = 'none';
        table.style.display = 'table';
      })
      .catch(err => {
        loading.innerText = "⚠️ Failed to load catalog. Please refresh.";
        console.error("Error fetching books:", err);
      });
  }

  /* --- SINGLE FIELD AUTOCOMPLETE ENGINE --- */
  function setupGlobalAutocomplete() {
    document.querySelectorAll('input[data-autocomplete="true"]').forEach(input => {
      input.addEventListener('input', function() {
        handleFieldInput(this);
      });
      input.addEventListener('keydown', function(e) {
        handleFieldKeyDown(e, this);
      });
    });
  }

  function handleFieldInput(inputElem) {
    const wrapper = inputElem.closest('.autocomplete-wrapper');
    const box = wrapper.querySelector('.suggestions-box');
    const query = inputElem.value.trim().toLowerCase();
    const targetCol = parseInt(inputElem.dataset.col);
    selectedIndex = -1;

    closeAllSuggestions();

    if (!query || !globalData || globalData.length <= 1) {
      return;
    }

    // Extract unique values matching the query for this specific column
    const matches = new Set();
    for (let i = 1; i < globalData.length; i++) {
      const fieldValue = String(globalData[i][targetCol] || '').trim();
      if (fieldValue && fieldValue.toLowerCase().includes(query)) {
        matches.add(fieldValue);
        if (matches.size >= 8) break;
      }
    }

    if (matches.size === 0) return;

    box.innerHTML = '';
    matches.forEach(value => {
      const item = document.createElement('div');
      item.className = 'suggestion-item';
      item.innerHTML = `<strong>${value}</strong>`;
      item.dataset.value = value;

      item.onclick = function() {
        inputElem.value = value;
        closeAllSuggestions();
      };
      box.appendChild(item);
    });

    box.style.display = 'block';
  }

  function handleFieldKeyDown(e, inputElem) {
    const wrapper = inputElem.closest('.autocomplete-wrapper');
    const box = wrapper.querySelector('.suggestions-box');
    const items = box.querySelectorAll('.suggestion-item');

    if (box.style.display === 'none' || items.length === 0) return;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      selectedIndex++;
      if (selectedIndex >= items.length) selectedIndex = 0;
      updateActiveItem(items);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      selectedIndex--;
      if (selectedIndex < 0) selectedIndex = items.length - 1;
      updateActiveItem(items);
    } else if (e.key === 'Enter') {
      if (selectedIndex >= 0 && selectedIndex < items.length) {
        e.preventDefault();
        inputElem.value = items[selectedIndex].dataset.value;
        closeAllSuggestions();
      }
    } else if (e.key === 'Escape') {
      closeAllSuggestions();
    }
  }

  function updateActiveItem(items) {
    items.forEach((item, index) => {
      if (index === selectedIndex) {
        item.classList.add('active');
        item.scrollIntoView({ block: 'nearest' });
      } else {
        item.classList.remove('active');
      }
    });
  }

  function closeAllSuggestions() {
    document.querySelectorAll('.suggestions-box').forEach(box => {
      box.style.display = 'none';
    });
    selectedIndex = -1;
  }

  // Called only when selecting an entry from the table to edit
  function populateFormFields(row) {
    document.getElementById('title').value = row[1] || '';
    document.getElementById('titleEng').value = row[2] || '';
    document.getElementById('subTitle').value = row[3] || '';
    document.getElementById('author').value = row[4] || '';
    document.getElementById('editor').value = row[5] || '';

    document.getElementById('commentaryContainer').innerHTML = '';
    const commString = row[6] || '';
    if (commString) {
      const pairs = commString.split(' | ');
      pairs.forEach(pair => {
        const match = pair.match(/(.*) \(Author: (.*)\)/);
        if (match) {
          addCommentaryRow(match[1], match[2]);
        } else {
          addCommentaryRow(pair, '');
        }
      });
    } else {
      addCommentaryRow();
    }

    document.getElementById('lang').value = row[7] || '';
    document.getElementById('vol').value = row[8] || '';
    document.getElementById('publisher').value = row[9] || '';
    document.getElementById('year').value = row[10] || '';
    document.getElementById('isbn').value = row[11] || '';
    document.getElementById('topic').value = row[12] || '';
    document.getElementById('subject').value = row[13] || '';
    document.getElementById('condition').value = row[14] || '';
  }

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.autocomplete-wrapper')) {
      closeAllSuggestions();
    }
  });

  document.getElementById('addBookForm').addEventListener('submit', function(e) {
    e.preventDefault();
    e.stopPropagation();

    if (isSubmitting) {
      return false;
    }

    const editRowIndex = document.getElementById('editRowIndex').value;
    if (editRowIndex && !adminToken) {
      alert("Only administrators can edit entries.");
      return;
    }

    isSubmitting = true;
    const submitBtn = document.getElementById('submitBtn');
    const originalText = submitBtn.innerText;

    submitBtn.disabled = true;
    submitBtn.innerText = editRowIndex ? "⏳ Updating Book..." : "⏳ Saving Book...";

    const formData = {
      slNo: document.getElementById('slNo').value,
      title: document.getElementById('title').value,
      titleEng: document.getElementById('titleEng').value,
      subTitle: document.getElementById('subTitle').value,
      author: document.getElementById('author').value,
      editor: document.getElementById('editor').value,
      commentariesLinked: getLinkedCommentaries(),
      lang: document.getElementById('lang').value,
      vol: document.getElementById('vol').value,
      publisher: document.getElementById('publisher').value,
      year: document.getElementById('year').value,
      isbn: document.getElementById('isbn').value,
      topic: document.getElementById('topic').value,
      subject: document.getElementById('subject').value,
      condition: document.getElementById('condition').value
    };

    const payload = {
      action: editRowIndex ? "update" : "add",
      adminToken: adminToken,
      rowIndex: editRowIndex ? parseInt(editRowIndex) + 1 : null,
      data: formData
    };

    fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
    .then(res => res.json())
    .then(res => {
      if (res.success) {
        alert(editRowIndex ? 'Book updated successfully!' : 'Book added successfully!');
        resetForm();
        fetchBooks();
      } else {
        alert("Error: " + res.message);
      }
    })
    .catch(err => alert("Submission failed: " + err))
    .finally(() => {
      isSubmitting = false;
      submitBtn.disabled = false;
      submitBtn.innerText = originalText;
    });
  });

  function editBook(index) {
    if (!adminToken) {
      alert("Unauthorized access.");
      return;
    }
    const row = globalData[index];
    document.getElementById('editRowIndex').value = index;
    document.getElementById('slNo').value = row[0] || '';
    
    populateFormFields(row);

    document.getElementById('formTitle').innerText = 'Edit Book Information (Admin)';
    document.getElementById('submitBtn').innerText = 'Update Book Info';
    document.getElementById('cancelBtn').style.display = 'inline-block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    document.getElementById('addBookForm').reset();
    document.getElementById('editRowIndex').value = '';
    document.getElementById('slNo').value = '';
    document.getElementById('commentaryContainer').innerHTML = '';
    addCommentaryRow();
    document.getElementById('formTitle').innerText = 'Add New Book Entry';
    document.getElementById('submitBtn').innerText = 'Add Book to Library';
    document.getElementById('cancelBtn').style.display = 'none';
  }

  function deleteBook(rowIndex) {
    if (!adminToken) {
      alert("Unauthorized access.");
      return;
    }
    if (confirm('Are you sure you want to delete this book entry?')) {
      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', adminToken: adminToken, rowIndex: rowIndex })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          alert('Book deleted!');
          fetchBooks();
        } else {
          alert('Error: ' + res.message);
        }
      })
      .catch(err => alert("Delete failed: " + err));
    }
  }

  function searchBooks() {
    const input = document.getElementById('searchBox').value.toLowerCase();
    const rows = document.getElementById('tableBody').getElementsByTagName('tr');
    for (let i = 0; i < rows.length; i++) {
      const text = rows[i].textContent.toLowerCase();
      rows[i].style.display = text.includes(input) ? '' : 'none';
    }
  }
</script>
</body>
</html>
