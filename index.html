<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Library Management System</title>
  <!-- QuaggaJS Fallback Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1, h2 { color: #333; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    input, select, button { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
    button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #218838; }
    button:disabled { background-color: #a5d6a7 !important; color: #ffffff !important; cursor: not-allowed !important; pointer-events: none !important; opacity: 0.6; }

    .btn-admin { background-color: #007bff; width: auto; padding: 8px 16px; }
    .btn-logout { background-color: #6c757d; width: auto; padding: 8px 16px; }
    .btn-feature { background-color: #17a2b8; width: auto; padding: 8px 14px; margin-left: 5px; color: white; }
    .btn-feature:hover { background-color: #138496; }
    
    .commentary-box { grid-column: 1 / -1; background: #eef2f7; padding: 12px; border-radius: 6px; border: 1px solid #d0d7de; }
    .commentary-row { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; }
    .commentary-row input { flex: 1; }
    .btn-remove { background: #dc3545; width: auto; padding: 6px 12px; }
    .btn-add { background: #17a2b8; margin-top: 5px; width: auto; padding: 6px 12px; }
    
    .btn-edit { background-color: #ffc107; color: #000; padding: 4px 8px; margin-right: 5px; width: auto; }
    .btn-delete { background-color: #dc3545; color: #fff; padding: 4px 8px; width: auto; }
    
    .toolbar { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; flex-wrap: wrap; }
    #searchBox { flex: 1; padding: 10px; font-size: 16px; min-width: 250px; }
    
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; vertical-align: middle; }
    th { background-color: #007bff; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    
    input:disabled { background-color: #e9ecef; cursor: not-allowed; }

    .autocomplete-wrapper { position: relative; width: 100%; }
    .suggestions-box {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1px solid #007bff;
      border-radius: 0 0 6px 6px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .suggestion-item {
      padding: 10px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }
    .suggestion-item:hover,
    .suggestion-item.active { 
      background-color: #007bff;
      color: #ffffff;
    }
    
    .loading-spinner { font-weight: bold; color: #007bff; padding: 15px; text-align: center; }

    /* Scanner Overlay Modal */
    #scannerModal {
      display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.85); justify-content: center; align-items: center; flex-direction: column;
    }
    .scanner-content {
      background: white; padding: 20px; border-radius: 8px; text-align: center; max-width: 500px; width: 90%;
    }
    #interactive.viewport, #nativeVideoWrapper {
      width: 100%; height: 280px; position: relative; overflow: hidden; background: #000; border-radius: 4px;
    }
    #interactive.viewport canvas, #interactive.viewport video, #nativeVideo {
      width: 100%; height: 100%; object-fit: cover;
    }
    .scanner-status { margin-top: 10px; font-weight: bold; color: #007bff; font-size: 14px; }

    /* Print Styles */
    @media print {
      body { background-color: white; margin: 0; }
      .header-bar, .card:first-of-type, .toolbar, .btn-edit, .btn-delete, th:last-child, td:last-child {
        display: none !important;
      }
      .card { box-shadow: none; padding: 0; }
      table { border: 1px solid #000; }
      th, td { border: 1px solid #000; font-size: 11px; }
      th { background-color: #eee !important; color: #000 !important; }
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>📚 Library Management System</h1>
    <div>
      <span id="roleBadge" style="margin-right: 10px; font-weight: bold; color: #555;">Role: Standard User</span>
      <button id="adminLoginBtn" class="btn-admin" onclick="toggleAdminLogin()">🔐 Admin Login</button>
      <button id="adminLogoutBtn" class="btn-logout" onclick="logoutAdmin()" style="display:none;">🔒 Logout Admin</button>
    </div>
  </div>

  <div class="card" id="bookFormCard">
    <h2 id="formTitle">Add New Book Entry</h2>
    <form id="addBookForm" autocomplete="off">
      <input type="hidden" id="editRowIndex" value="">
      <div class="form-grid">
        <input type="text" id="slNo" placeholder="Sl. No (Auto-generated)" disabled>
        
        <div class="autocomplete-wrapper">
          <input type="text" id="title" data-col="1" data-autocomplete="true" placeholder="Title (Original)" required>
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="titleEng" data-col="2" data-autocomplete="true" placeholder="Title (English)">
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="subTitle" data-col="3" data-autocomplete="true" placeholder="Sub-title">
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="author" data-col="4" data-autocomplete="true" placeholder="Author & CoAuthor">
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="editor" data-col="5" data-autocomplete="true" placeholder="Editor & Co-Editor">
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="lang" data-col="7" data-autocomplete="true" placeholder="Language">
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="vol" data-col="8" data-autocomplete="true" placeholder="Vol (IF)">
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="publisher" data-col="9" data-autocomplete="true" placeholder="Publisher">
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="year" data-col="10" data-autocomplete="true" placeholder="Year of Print">
          <div class="suggestions-box"></div>
        </div>

        <!-- ISBN Barcode Scanner -->
        <div class="autocomplete-wrapper" style="display: flex; gap: 5px;">
          <input type="text" id="isbn" data-col="11" data-autocomplete="true" placeholder="ISBN (Scan or Type)" onchange="fetchMetadataByISBN(this.value)">
          <button type="button" class="btn-feature" title="Scan Barcode via Camera" onclick="openBarcodeScanner()">📷 Scan</button>
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="topic" data-col="12" data-autocomplete="true" placeholder="Topic">
          <div class="suggestions-box"></div>
        </div>

        <div class="autocomplete-wrapper">
          <input type="text" id="subject" data-col="13" data-autocomplete="true" placeholder="Subject">
          <div class="suggestions-box"></div>
        </div>

        <select id="condition" required>
          <option value="" disabled selected>Select Condition...</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
        </select>

        <div class="commentary-box">
          <label><strong>Commentaries & Their Authors:</strong></label>
          <div id="commentaryContainer" style="margin-top: 8px;"></div>
          <button type="button" class="btn-add" onclick="addCommentaryRow()">+ Add Commentary & Author</button>
        </div>
      </div>
      <br>
      <button type="submit" id="submitBtn">Add Book to Library</button>
      <button type="button" id="cancelBtn" onclick="resetForm()" style="background-color: #6c757d; display: none; margin-top: 5px;">Cancel Editing</button>
    </form>
  </div>

  <div class="card">
    <h2>Book Catalogue</h2>
    <div class="toolbar">
      <input type="text" id="searchBox" onkeyup="searchBooks()" placeholder="🔍 Search by Title, Author, Subject, etc...">
      <button type="button" class="btn-feature" onclick="exportToCSV()">📥 Export CSV</button>
      <button type="button" class="btn-feature" onclick="window.print()">🖨️ Print / PDF</button>
    </div>

    <div style="overflow-x:auto;">
      <div id="loadingIndicator" class="loading-spinner">⏳ Fetching library records, please wait...</div>
      <table id="booksTable" style="display:none;">
        <thead>
          <tr id="tableHead"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Camera Scanner Modal -->
  <div id="scannerModal">
    <div class="scanner-content">
      <h3 style="margin-top:0;">Position ISBN Barcode in View</h3>
      
      <div id="nativeVideoWrapper" style="display:none;">
        <video id="nativeVideo" autoplay playsinline></video>
      </div>
      <div id="interactive" class="viewport" style="display:none;"></div>

      <div id="scannerStatus" class="scanner-status">Initializing Camera...</div>
      <br>
      <button type="button" class="btn-remove" onclick="closeBarcodeScanner()">Close Scanner</button>
    </div>
  </div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbydUNQacZxE91f6IC6vuQlZsVGGUj8-mFdwuzU2Hpw1CRjFq7DNWZT2hWyIelmYErxU/exec';
  
  let adminToken = null;
  let globalData = [];
  let selectedIndex = -1;
  let isSubmitting = false;

  // Scanner Variables
  let nativeStream = null;
  let nativeScanInterval = null;

  window.onload = function() {
    addCommentaryRow();
    fetchBooks();
    setupGlobalAutocomplete();
  };

  function toggleAdminLogin() {
    const pwd = prompt("Enter Admin Password:");
    if (!pwd) return;

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'login', password: pwd })
    })
    .then(res => res.json())
    .then(res => {
      if (res.success) {
        adminToken = res.token;
        alert("Admin mode activated!");
        updateAdminUI(true);
      } else {
        alert("Incorrect Password!");
      }
    })
    .catch(err => alert("Connection error: " + err));
  }

  function logoutAdmin() {
    adminToken = null;
    alert("Logged out of Admin mode.");
    updateAdminUI(false);
    resetForm();
  }

  function updateAdminUI(isAdmin) {
    document.getElementById('roleBadge').innerText = isAdmin ? 'Role: Administrator' : 'Role: Standard User';
    document.getElementById('adminLoginBtn').style.display = isAdmin ? 'none' : 'inline-block';
    document.getElementById('adminLogoutBtn').style.display = isAdmin ? 'inline-block' : 'none';
    fetchBooks();
  }

  function addCommentaryRow(name, author) {
    name = name || '';
    author = author || '';
    const container = document.getElementById('commentaryContainer');
    const div = document.createElement('div');
    div.className = 'commentary-row';
    div.innerHTML = '<input type="text" class="comm-name" placeholder="Commentary Title" value="' + name + '">' +
                    '<input type="text" class="comm-author" placeholder="Author of Commentary" value="' + author + '">' +
                    '<button type="button" class="btn-remove" onclick="this.parentElement.remove()">✕</button>';
    container.appendChild(div);
  }

  function getLinkedCommentaries() {
    const names = document.querySelectorAll('.comm-name');
    const authors = document.querySelectorAll('.comm-author');
    let result = [];
    names.forEach((elem, idx) => {
      const commName = elem.value.trim();
      const commAuthor = authors[idx].value.trim();
      if (commName || commAuthor) {
        result.push((commName || 'Untitled') + ' (Author: ' + (commAuthor || 'Unknown') + ')');
      }
    });
    return result.join(' | ');
  }

  function fetchBooks() {
    const loading = document.getElementById('loadingIndicator');
    const table = document.getElementById('booksTable');
    loading.style.display = 'block';
    table.style.display = 'none';

    fetch(SCRIPT_URL)
      .then(res => res.json())
      .then(data => {
        globalData = data;
        const head = document.getElementById('tableHead');
        const body = document.getElementById('tableBody');

        if (data && data.length > 0) {
          let headHtml = '';
          data[0].forEach(col => { headHtml += '<th>' + col + '</th>'; });
          if (adminToken) { headHtml += '<th>Actions</th>'; }
          head.innerHTML = headHtml;

          let bodyHtml = '';
          for (let i = 1; i < data.length; i++) {
            bodyHtml += '<tr>';
            data[i].forEach(cell => {
              bodyHtml += '<td>' + (cell !== undefined ? cell : '') + '</td>';
            });

            if (adminToken) {
              bodyHtml += '<td>' +
                '<button class="btn-edit" onclick="editBook(' + i + ')">Edit</button>' +
                '<button class="btn-delete" onclick="deleteBook(' + (i + 1) + ')">Delete</button>' +
              '</td>';
            }
            bodyHtml += '</tr>';
          }
          body.innerHTML = bodyHtml;
        }

        loading.style.display = 'none';
        table.style.display = 'table';
      })
      .catch(err => {
        loading.innerText = "⚠️ Failed to load catalog. Refresh page.";
        console.error("Error fetching books:", err);
      });
  }

  /* --- ISBN AUTO-METADATA LOOKUP (Open Library API) --- */
  function fetchMetadataByISBN(isbnRaw) {
    const isbn = isbnRaw.replace(/[^0-9X]/gi, '');
    if (!isbn || (isbn.length !== 10 && isbn.length !== 13)) return;

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.innerText = "⏳ Fetching Book Details from Open Library...";

    fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`)
      .then(res => res.json())
      .then(data => {
        const bookKey = `ISBN:${isbn}`;
        if (data && data[bookKey]) {
          const book = data[bookKey];
          if (!document.getElementById('title').value) document.getElementById('title').value = book.title || '';
          if (!document.getElementById('author').value && book.authors) {
            document.getElementById('author').value = book.authors.map(a => a.name).join(', ');
          }
          if (!document.getElementById('publisher').value && book.publishers) {
            document.getElementById('publisher').value = book.publishers.map(p => p.name).join(', ');
          }
          if (!document.getElementById('year').value && book.publish_date) {
            document.getElementById('year').value = book.publish_date;
          }
          if (!document.getElementById('subTitle').value && book.subtitle) {
            document.getElementById('subTitle').value = book.subtitle;
          }
        }
      })
      .catch(err => console.warn("ISBN Fetch error:", err))
      .finally(() => {
        const editRowIndex = document.getElementById('editRowIndex').value;
        submitBtn.innerText = editRowIndex ? 'Update Book Info' : 'Add Book to Library';
      });
  }

  /* --- HYBRID BARCODE SCANNER ENGINE (Native + Strict Fallback) --- */
  function openBarcodeScanner() {
    document.getElementById('scannerModal').style.display = 'flex';
    document.getElementById('scannerStatus').innerText = "Starting camera...";

    if ('BarcodeDetector' in window) {
      startNativeScanner();
    } else {
      startStrictQuaggaScanner();
    }
  }

  function handleSuccessfulScan(rawCode) {
    const code = rawCode.trim();
    // Validate EAN-13 ISBN prefixes (978 / 979) or valid 10-digit ISBN
    if ((code.startsWith("978") || code.startsWith("979")) && code.length === 13) {
      document.getElementById('isbn').value = code;
      fetchMetadataByISBN(code);
      closeBarcodeScanner();
    } else if (code.length === 10) {
      document.getElementById('isbn').value = code;
      fetchMetadataByISBN(code);
      closeBarcodeScanner();
    } else {
      document.getElementById('scannerStatus').innerText = `⚠️ Scanned non-ISBN barcode (${code}). Try again.`;
    }
  }

  /* 1. NATIVE BROWSER DETECTOR (Chrome/Edge/Android) */
  async function startNativeScanner() {
    document.getElementById('nativeVideoWrapper').style.display = 'block';
    document.getElementById('interactive').style.display = 'none';
    const video = document.getElementById('nativeVideo');

    try {
      nativeStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      video.srcObject = nativeStream;

      const barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'ean_8'] });
      document.getElementById('scannerStatus').innerText = "Native Detector Ready. Align barcode...";

      nativeScanInterval = setInterval(async () => {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          try {
            const barcodes = await barcodeDetector.detect(video);
            if (barcodes.length > 0) {
              handleSuccessfulScan(barcodes[0].rawValue);
            }
          } catch (e) { console.error(e); }
        }
      }, 200);

    } catch (err) {
      console.warn("Native camera failed, falling back to engine:", err);
      startStrictQuaggaScanner();
    }
  }

  /* 2. STRICT QUAGGA FALLBACK ENGINE (Safari / Firefox) */
  function startStrictQuaggaScanner() {
    document.getElementById('nativeVideoWrapper').style.display = 'none';
    document.getElementById('interactive').style.display = 'block';
    document.getElementById('scannerStatus').innerText = "Align ISBN Barcode inside window...";

    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: document.querySelector('#interactive'),
        constraints: { facingMode: "environment", focusMode: "continuous" }
      },
      // Restrict strictly to EAN-13 to prevent misreads
      decoder: { readers: ["ean_reader"], multiple: false },
      locate: true
    }, function(err) {
      if (err) {
        alert("Camera permission denied or unavailable.");
        closeBarcodeScanner();
        return;
      }
      Quagga.start();
    });

    let lastCode = "";
    let matchCount = 0;

    Quagga.onDetected(function(result) {
      if (result && result.codeResult && result.codeResult.code) {
        const code = result.codeResult.code;

        // Verify checked length and ISBN prefixes
        if ((code.startsWith("978") || code.startsWith("979")) && code.length === 13) {
          if (code === lastCode) {
            matchCount++;
          } else {
            lastCode = code;
            matchCount = 1;
          }

          // Require 3 consecutive identical reads to guarantee 100% accuracy
          if (matchCount >= 3) {
            handleSuccessfulScan(code);
          }
        }
      }
    });
  }

  function closeBarcodeScanner() {
    if (nativeScanInterval) clearInterval(nativeScanInterval);
    if (nativeStream) {
      nativeStream.getTracks().forEach(track => track.stop());
      nativeStream = null;
    }
    try { Quagga.stop(); } catch(e){}

    document.getElementById('scannerModal').style.display = 'none';
    document.getElementById('nativeVideoWrapper').style.display = 'none';
    document.getElementById('interactive').style.display = 'none';
  }

  /* --- EXPORT CSV --- */
  function exportToCSV() {
    if (!globalData || globalData.length === 0) {
      alert("No data to export.");
      return;
    }
    let csvContent = "data:text/csv;charset=utf-8,";
    globalData.forEach(row => {
      const escapedRow = row.map(cell => `"${(cell !== undefined ? cell : '').toString().replace(/"/g, '""')}"`);
      csvContent += escapedRow.join(",") + "\r\n";
    });
    
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `Library_Catalog_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  /* --- AUTOCOMPLETE ENGINE --- */
  function setupGlobalAutocomplete() {
    document.querySelectorAll('input[data-autocomplete="true"]').forEach(input => {
      input.addEventListener('input', function() { handleFieldInput(this); });
      input.addEventListener('keydown', function(e) { handleFieldKeyDown(e, this); });
    });
  }

  function handleFieldInput(inputElem) {
    const wrapper = inputElem.closest('.autocomplete-wrapper');
    const box = wrapper.querySelector('.suggestions-box');
    const query = inputElem.value.trim().toLowerCase();
    const targetCol = parseInt(inputElem.dataset.col);
    selectedIndex = -1;

    closeAllSuggestions();

    if (!query || !globalData || globalData.length <= 1) return;

    const matches = new Set();
    for (let i = 1; i < globalData.length; i++) {
      const fieldValue = String(globalData[i][targetCol] || '').trim();
      if (fieldValue && fieldValue.toLowerCase().includes(query)) {
        matches.add(fieldValue);
        if (matches.size >= 8) break;
      }
    }

    if (matches.size === 0) return;

    box.innerHTML = '';
    matches.forEach(value => {
      const item = document.createElement('div');
      item.className = 'suggestion-item';
      item.innerHTML = `<strong>${value}</strong>`;
      item.dataset.value = value;

      item.onmousedown = function(e) {
        e.preventDefault();
        inputElem.value = value;
        closeAllSuggestions();
      };
      box.appendChild(item);
    });

    box.style.display = 'block';
  }

  function handleFieldKeyDown(e, inputElem) {
    const wrapper = inputElem.closest('.autocomplete-wrapper');
    const box = wrapper.querySelector('.suggestions-box');
    const items = box.querySelectorAll('.suggestion-item');

    if (box.style.display === 'none' || items.length === 0) return;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      selectedIndex = (selectedIndex + 1) % items.length;
      updateActiveItem(items);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      selectedIndex = (selectedIndex - 1 + items.length) % items.length;
      updateActiveItem(items);
    } else if (e.key === 'Enter') {
      if (selectedIndex >= 0 && selectedIndex < items.length) {
        e.preventDefault();
        inputElem.value = items[selectedIndex].dataset.value;
        closeAllSuggestions();
      }
    } else if (e.key === 'Escape') {
      closeAllSuggestions();
    }
  }

  function updateActiveItem(items) {
    items.forEach((item, idx) => {
      if (idx === selectedIndex) {
        item.classList.add('active');
        item.scrollIntoView({ block: 'nearest' });
      } else {
        item.classList.remove('active');
      }
    });
  }

  function closeAllSuggestions() {
    document.querySelectorAll('.suggestions-box').forEach(box => { box.style.display = 'none'; });
    selectedIndex = -1;
  }

  function populateFormFields(row) {
    document.getElementById('title').value = row[1] || '';
    document.getElementById('titleEng').value = row[2] || '';
    document.getElementById('subTitle').value = row[3] || '';
    document.getElementById('author').value = row[4] || '';
    document.getElementById('editor').value = row[5] || '';

    document.getElementById('commentaryContainer').innerHTML = '';
    const commString = row[6] || '';
    if (commString) {
      const pairs = commString.split(' | ');
      pairs.forEach(pair => {
        const match = pair.match(/(.*) \(Author: (.*)\)/);
        if (match) {
          addCommentaryRow(match[1], match[2]);
        } else {
          addCommentaryRow(pair, '');
        }
      });
    } else {
      addCommentaryRow();
    }

    document.getElementById('lang').value = row[7] || '';
    document.getElementById('vol').value = row[8] || '';
    document.getElementById('publisher').value = row[9] || '';
    document.getElementById('year').value = row[10] || '';
    document.getElementById('isbn').value = row[11] || '';
    document.getElementById('topic').value = row[12] || '';
    document.getElementById('subject').value = row[13] || '';
    document.getElementById('condition').value = row[14] || '';
  }

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.autocomplete-wrapper')) closeAllSuggestions();
  });

  document.getElementById('addBookForm').addEventListener('submit', function(e) {
    e.preventDefault();
    if (isSubmitting) return false;

    const editRowIndex = document.getElementById('editRowIndex').value;
    if (editRowIndex && !adminToken) {
      alert("Only administrators can edit entries.");
      return;
    }

    isSubmitting = true;
    const submitBtn = document.getElementById('submitBtn');
    const originalText = submitBtn.innerText;

    submitBtn.disabled = true;
    submitBtn.innerText = editRowIndex ? "⏳ Updating..." : "⏳ Saving...";

    const formData = {
      slNo: document.getElementById('slNo').value,
      title: document.getElementById('title').value,
      titleEng: document.getElementById('titleEng').value,
      subTitle: document.getElementById('subTitle').value,
      author: document.getElementById('author').value,
      editor: document.getElementById('editor').value,
      commentariesLinked: getLinkedCommentaries(),
      lang: document.getElementById('lang').value,
      vol: document.getElementById('vol').value,
      publisher: document.getElementById('publisher').value,
      year: document.getElementById('year').value,
      isbn: document.getElementById('isbn').value,
      topic: document.getElementById('topic').value,
      subject: document.getElementById('subject').value,
      condition: document.getElementById('condition').value
    };

    const payload = {
      action: editRowIndex ? "update" : "add",
      adminToken: adminToken,
      rowIndex: editRowIndex ? parseInt(editRowIndex) + 1 : null,
      data: formData
    };

    fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
    .then(res => res.json())
    .then(res => {
      if (res.success) {
        alert(editRowIndex ? 'Book updated!' : 'Book added!');
        resetForm();
        fetchBooks();
      } else {
        alert("Error: " + res.message);
      }
    })
    .catch(err => alert("Submission failed: " + err))
    .finally(() => {
      isSubmitting = false;
      submitBtn.disabled = false;
      submitBtn.innerText = originalText;
    });
  });

  function editBook(index) {
    if (!adminToken) { alert("Unauthorized."); return; }
    const row = globalData[index];
    document.getElementById('editRowIndex').value = index;
    document.getElementById('slNo').value = row[0] || '';
    
    populateFormFields(row);

    document.getElementById('formTitle').innerText = 'Edit Book Information (Admin)';
    document.getElementById('submitBtn').innerText = 'Update Book Info';
    document.getElementById('cancelBtn').style.display = 'inline-block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    document.getElementById('addBookForm').reset();
    document.getElementById('editRowIndex').value = '';
    document.getElementById('slNo').value = '';
    document.getElementById('commentaryContainer').innerHTML = '';
    addCommentaryRow();
    document.getElementById('formTitle').innerText = 'Add New Book Entry';
    document.getElementById('submitBtn').innerText = 'Add Book to Library';
    document.getElementById('cancelBtn').style.display = 'none';
  }

  function deleteBook(rowIndex) {
    if (!adminToken) { alert("Unauthorized."); return; }
    if (confirm('Delete this book entry?')) {
      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', adminToken: adminToken, rowIndex: rowIndex })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          alert('Book deleted!');
          fetchBooks();
        } else {
          alert('Error: ' + res.message);
        }
      })
      .catch(err => alert("Delete failed: " + err));
    }
  }

  function searchBooks() {
    const input = document.getElementById('searchBox').value.toLowerCase();
    const rows = document.getElementById('tableBody').getElementsByTagName('tr');
    for (let i = 0; i < rows.length; i++) {
      const text = rows[i].textContent.toLowerCase();
      rows[i].style.display = text.includes(input) ? '' : 'none';
    }
  }
</script>
</body>
</html>
